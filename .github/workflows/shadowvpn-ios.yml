name: Build shadowvpn-ios

on:
  workflow_dispatch:
  # 手动触发
    inputs:
      build_type:
        description: "构建类型"
        required: true
        default: "Release"
      tags:
        description: '指定 shadowvpn-ios 版本号（如 v1.0.0 或 latest）'
        required: true
        default: '1.0.0'

jobs:

  build-ios:
    name: Build iOS App (No Signing)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          repository: madeye/shadowvpn-ios
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_26.1.app"

      - name: Build iOS target
        run: |
          ./scripts/build-rust.sh        # → ShadowVPNCore/Frameworks/ShadowVPNCore.xcframework
          echo "// Local.xcconfig - Placeholder" > Local.xcconfig
          brew install xcodegen
          ./scripts/generate-xcodeproj.sh   # → shadowvpn-ios.xcodeproj
          # ./scripts/gen-gfwlist.sh
          xcodebuild -list
          xcodebuild clean build \
          -project shadowvpn-ios.xcodeproj \
          -scheme shadowvpn-ios \
          -configuration Release \
          -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=latest' \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGN_IDENTITY="" \
          PROVISIONING_PROFILE_SPECIFIER="" \
          SKIP_INSTALL=NO \
          | xcpretty
          # archive \
          # -archivePath build/ios/shadowvpn-ios.xcarchive
      - name: Export app and zip
        run: |
          mkdir -p Payload
          cp -r build/ios/shadowvpn-ios.xcarchive/Products/Applications/*.app Payload
          zip -r "shadowvpn-ios-${{ github.event.inputs.tags }}.ipa" Payload/
      - uses: actions/upload-artifact@v4
        with:
          name: shadowvpn-ios-${{ github.event.inputs.tags }}
          path: "shadowvpn-ios-${{ github.event.inputs.tags }}.ipa"
      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "shadowvpn-ios-${{ github.event.inputs.tags }}"
          name: "shadowvpn-ios-${{ github.event.inputs.tags }}"
          files: "shadowvpn-ios-${{ github.event.inputs.tags }}.ipa"
          # draft: false
          # prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
