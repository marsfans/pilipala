name: Build & Release Transmission

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 4.0.6)"
        required: true
        type: string
        default: '4.0.6'

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]   # Windows 已换成 macOS

    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: transmission/transmission
          ref: ${{ github.event.inputs.version }}
          submodules: recursive
          fetch-depth: 0

      - name: Determine version
        id: version
        shell: bash
        run: echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT

      # -------- Dependencies --------
      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential automake autoconf libtool pkg-config intltool gettext \
            libcurl4-openssl-dev libssl-dev libevent-dev \
            libgtk-3-dev libgtkmm-3.0-dev qtbase5-dev qttools5-dev qttools5-dev-tools libappindicator3-dev

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install cmake ninja curl openssl@3 libevent qt@6 gtk4 gtkmm4

      # -------- Build --------
      - name: Configure
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_CLI=ON \
            -DENABLE_DAEMON=ON \
            -DENABLE_GTK=${{ runner.os == 'Linux' && 'ON' || 'OFF' }} \
            -DENABLE_QT=ON \
            -DENABLE_MAC=${{ runner.os == 'macOS' && 'ON' || 'OFF' }}

      - name: Build
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            ninja -C build transmission-mac transmission-cli transmission-daemon
          else
            cmake --build build --parallel
          fi

      # -------- Package --------
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            cp build/daemon/transmission-daemon dist/
            cp build/cli/transmission-cli dist/
            cp -r build/gtk dist/ || true
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            cp build/transmission-mac dist/Transmission.app || true
            cp build/cli/transmission-cli dist/
            cp build/daemon/transmission-daemon dist/
          fi
          
          tar -czf transmission-${{ steps.version.outputs.version }}-${{ runner.os }}.tar.gz dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: transmission-${{ runner.os }}
          path: transmission-${{ steps.version.outputs.version }}-${{ runner.os }}.tar.gz

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: "Transmission ${{ github.event.inputs.version }}"
          body: |
            ## Transmission ${{ github.event.inputs.version }}
            
            Automated build for Linux and macOS.
          draft: false
          prerelease: false
          files: |
            **/*.tar.gz
