name: Build Orange-Cloud

on:
  workflow_dispatch:
  # 手动触发
    inputs:
      build_type:
        description: "构建类型"
        required: true
        default: "Release"
      tags:
        description: '指定 orange-cloud 版本号（如 v1.0.0 或 latest）'
        required: true
        default: '1.3.1'

jobs:

  build-ios:
    name: Build iOS App (No Signing)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          repository: chen2he/orange-cloud
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_26.1.app"

      - name: Build iOS target
        run: |
          cd apps/ios/Orange Cloud/
          xcodebuild -list
          xcodebuild \
          -project "Orange Cloud.xcodeproj" \
          -scheme "Orange Cloud" \
          -configuration ${{ github.event.inputs.build_type }} \
          -sdk iphoneos \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGN_IDENTITY="" \
          PROVISIONING_PROFILE_SPECIFIER="" \
          SKIP_INSTALL=NO \
          archive \
          -archivePath build/ios/Orange-Cloud.xcarchive
      - name: Export app and zip
        run: |
          mkdir -p Payload
          cp -r build/ios/Orange-Cloud.xcarchive/Products/Applications/*.app Payload
          zip -r "Orange-Cloud-${{ github.event.inputs.tags }}.ipa" Payload/
      - uses: actions/upload-artifact@v4
        with:
          name: Orange-Cloud-${{ github.event.inputs.tags }}
          path: "Orange-Cloud-${{ github.event.inputs.tags }}.ipa"
      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "Orange-Cloud-${{ github.event.inputs.tags }}"
          name: "Orange-Cloud-${{ github.event.inputs.tags }}"
          files: "Orange-Cloud-${{ github.event.inputs.tags }}.ipa"
          # draft: false
          # prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}