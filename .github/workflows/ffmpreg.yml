name: Rust multi‑platform CI
on:
  # ① 通过 Web UI 手动触发
  workflow_dispatch:
    inputs:
      tags:
        description: '指定 torrent 版本号（如 v1.2.3 或 latest）'
        required: true
        default: '1.0.0'

jobs:
  build:
    name: Build on ${{ matrix.os }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          # ----------------------------------------------------
          # Linux
          # ----------------------------------------------------
            - os: ubuntu-latest
              target: x86_64-unknown-linux-gnu
            - os: ubuntu-latest
              target: i686-unknown-linux-gnu
            - os: ubuntu-latest
              target: aarch64-unknown-linux-gnu
            # ----------------------------------------------------
            # macOS
            # ----------------------------------------------------
            - os: macos-latest
              target: x86_64-apple-darwin
            - os: macos-latest
              target: aarch64-apple-darwin
            # ----------------------------------------------------
            # Windows
            # ----------------------------------------------------
            - os: windows-latest
              target: x86_64-pc-windows-msvc
            - os: windows-latest
              target: i686-pc-windows-msvc
    steps:
      # ----------------------------------------------------------------
      # 0️⃣ 1. Checkout the repo *exactly* at the wanted ref
      # ----------------------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: 'yazaldefilimone/ffmpreg'

      # ----------------------------------------------------------------
      # 1️⃣ 2. Install Rust toolchain (stable) and the target you need
      # ----------------------------------------------------------------
      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          rustup_component_name: rust-src
          toolchain: stable
          target: ${{ matrix.target }}
          override: true
          cache: true

      # ----------------------------------------------------------------
      # 2️⃣ 3. Cache Cargo registry / builds (speed boost)
      # ----------------------------------------------------------------
      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache Cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-${{ matrix.target }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-${{ matrix.target }}-

      # ----------------------------------------------------------------
      # 3️⃣ 4. Build the binary
      # ----------------------------------------------------------------
      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      # ----------------------------------------------------------------
      # 5️⃣ 6. Collect artifacts
      # ----------------------------------------------------------------
      - name: Prepare artifact
        run: |
          mkdir -p artifacts
          cp target/${{ matrix.target }}/release/${{ env.PROJECT_BIN }} artifacts/
        env:
          # 如果你的二进制名不是 Cargo package name，手动修改
          PROJECT_BIN: ffmpreg
          # Windows 需要 .exe
          # PROJECT_BIN: ffmpreg.exe
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpreg-${{ matrix.target }}
          path: artifacts/${{ env.PROJECT_BIN }}

      # ----------------------------------------------------------------
      # 7️⃣ 7. Optional: create GitHub Release on tag push
      # ----------------------------------------------------------------
      - if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: artifacts/${{ env.PROJECT_BIN }}


