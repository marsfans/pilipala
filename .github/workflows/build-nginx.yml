name: Build Nginx (HTTP/3) – static binary

# ① 触发方式
on:
  # ② 手动触发（可自行传入版本）
  workflow_dispatch:
    inputs:
      openssl_version:
        description: 'OpenSSL version (e.g. 3.0.10)'
        required: true
        default: '3.0.21'
      pcre_version:
        description: 'PCRE version (e.g. 8.45)'
        required: true
        default: '10.47'
      zlib_version:
        description: 'zlib version (e.g. 1.3.1)'
        required: true
        default: '1.3.2'
      nginx_version:
        description: 'Nginx version (e.g. 1.27.1)'
        required: true
        default: '1.31.2'

jobs:
  build-windows:
    strategy:
      matrix:
        os: [windows-latest]
        arch: [x86_64, arm64]
        # exclude:                  # <‑‑ 过滤掉不合法组合
        #   - os: macos-latest
        #     arch: x86_64           # macOS 只能跑 arm64
    runs-on: ${{ matrix.os }}
    env:
      # ③ 统一放在 env 里，方便后面引用
      OPENSSL_VER: ${{ github.event.inputs.openssl_version || '3.0.10' }}
      PCRE_VER:      ${{ github.event.inputs.pcre_version      || '8.45' }}
      ZLIB_VER:     ${{ github.event.inputs.zlib_version     || '1.3.1' }}
      NGINX_VER:    ${{ github.event.inputs.nginx_version    || '1.27.1' }}
      ARTIFACT_NAME: nginx-static-${{ matrix.os }}-${{ matrix.arch }}-${{ github.event.inputs.nginx_version || '1.27.1' }}.zip
    steps:
      # ------------------------------------------------------------------
      # 0️⃣  检出代码
      # ------------------------------------------------------------------
      - uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # 1️⃣  安装 Visual Studio Build Tools (MSVC)
      # ------------------------------------------------------------------
      - name: Install MSBuild
        uses: microsoft/setup-msbuild@v1.1
        with:
          vs-version: '17.8'   # 默认最新版本

      # ------------------------------------------------------------------
      # 2️⃣  安装 vcpkg 并集成到 MSBuild
      # ------------------------------------------------------------------
      - name: Install vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          .\vcpkg\bootstrap-vcpkg.bat
          .\vcpkg\vcpkg integrate install

      # ------------------------------------------------------------------
      # 3️⃣  用 vcpkg 安装静态 OpenSSL / PCRE2 / zlib
      # ------------------------------------------------------------------
      - name: Install dependencies via vcpkg
        run: |
          .\vcpkg\vcpkg install openssl:x64-windows-static
          .\vcpkg\vcpkg install pcre2:x64-windows-static
          .\vcpkg\vcpkg install zlib:x64-windows-static

      # ------------------------------------------------------------------
      # 4️⃣  配置 Nginx
      # ------------------------------------------------------------------
      # 这里用 PowerShell 语法，注意路径写成 Windows 风格
      - name: Configure Nginx
        run: |
          $OpenSSLDir = ".\vcpkg\installed\x64-windows-static"
          $PcreDir    = ".\vcpkg\installed\x64-windows-static"
          $ZlibDir    = ".\vcpkg\installed\x64-windows-static"

          # 先下载 Nginx 源码（如果你已经在 repo 里可以省略）
          # 这里假设你在 repo 根目录放了 nginx-${{ env.NGINX_VER }}.tar.gz
          # 你也可以直接 `git clone` 官方仓库

          # 进入源码目录
          mkdir -p ~/nginx
          cd ~/nginx
          curl -L -O https://nginx.org/download/nginx-${{ env.NGINX_VER }}.tar.gz
          tar xzf nginx-${{ env.NGINX_VER }}.tar.gz
          cd nginx-${{ env.NGINX_VER }}

          # 运行 configure
          ./configure `
            --prefix=C:\nginx `
            --sbin-path=C:\nginx\nginx.exe `
            --modules-path=C:\nginx\modules `
            --conf-path=C:\nginx\nginx.conf `
            --error-log-path=C:\nginx\logs\error.log `
            --http-log-path=C:\nginx\logs\access.log `
            --pid-path=C:\nginx\run\nginx.pid `
            --lock-path=C:\nginx\run\nginx.lock `
            --with-cc-opt="/MT /O2 -I$OpenSSLDir\include -I$PcreDir\include -I$ZlibDir\include" `
            --with-ld-opt="/LIBPATH:$OpenSSLDir\lib /LIBPATH:$PcreDir\lib /LIBPATH:$ZlibDir\lib /lssl /lcrypto /lpcre2-8 /lz /lws2_32 /luserenv /lkernel32 /luser32 /lshlwapi" `
            --with-http_v3_module `
            --with-http_ssl_module `
            --with-http_gzip_static_module
            # --with-pcre2 `
            # --with-pcre2-jit `
            # --with-openssl=$OpenSSLDir

      # ------------------------------------------------------------------
      # 5️⃣  编译 Nginx
      # ------------------------------------------------------------------
      - name: Build Nginx
        run: |
          # Nginx 的 Makefile 里用的是 nmake
          nmake -f Makefile

      # ------------------------------------------------------------------
      # 6️⃣  打包
      # ------------------------------------------------------------------
      - name: Package
        run: |
          # 把整个安装目录压成 zip
          Compress-Archive -Path C:\nginx\* -DestinationPath ${{ env.ARTIFACT_NAME }}
      # ──────────────────────────────────────────────────────────────────────
      # ⑭ 上传到 GitHub Release
      - name: Create Release and upload asset
        uses: softprops/action-gh-release@v1
        with:
          tag_name: nginx-${{ env.NGINX_VER }}
          name: Nginx ${{ env.NGINX_VER }} (static, HTTP/3)
          body: |
            **OpenSSL**: ${{ env.OPENSSL_VER }}  
            **PCRE**: ${{ env.PCRE_VER }}  
            **zlib**: ${{ env.ZLIB_VER }}  
            **Nginx**: ${{ env.NGINX_VER }}
          files: ${{ env.ARTIFACT_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ⑰ (可选) 验证编译结果
      - name: Verify build
        run: |
          C:\nginx\nginx.exe -V
          # 下面的 curl 需要 curl 7.80+，可在后续 job 中安装
          # curl -I --http3 https://example.com
          
  build-linux:
    strategy:
      matrix:
        os: [ubuntu-latest]
        arch: [x86_64, arm64]
        # exclude:                  # <‑‑ 过滤掉不合法组合
        #   - os: macos-latest
        #     arch: x86_64           # macOS 只能跑 arm64
    runs-on: ${{ matrix.os }}
    env:
      # ③ 统一放在 env 里，方便后面引用
      OPENSSL_VER: ${{ github.event.inputs.openssl_version || '3.0.10' }}
      PCRE_VER:      ${{ github.event.inputs.pcre_version      || '8.45' }}
      ZLIB_VER:     ${{ github.event.inputs.zlib_version     || '1.3.1' }}
      NGINX_VER:    ${{ github.event.inputs.nginx_version    || '1.27.1' }}
      ARTIFACT_NAME: nginx-static-${{ matrix.os }}-${{ matrix.arch }}-${{ github.event.inputs.nginx_version || '1.27.1' }}.tar.gz
    steps:
      # ④ 代码拉取
      - uses: actions/checkout@v4

      # ──────────────────────────────────────────────────────────────────────
      # 6️⃣  Install build tools – Ubuntu uses apt, macOS uses brew
      - name: Install build tools (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential wget git ca-certificates

      # ⑥ Cache OpenSSL build (to speed up)
      - name: Cache OpenSSL
        uses: actions/cache@v4
        with:
          path: ~/openssl
          key: openssl-${{ env.OPENSSL_VER }}-${{ runner.os }}
          restore-keys: openssl-${{ env.OPENSSL_VER }}-${{ runner.os }}

      # ⑦ 编译 OpenSSL（静态）
      - name: Build OpenSSL static
        run: |
          mkdir -p ~/openssl
          cd ~/openssl
          if [ ! -f "openssl-${OPENSSL_VER}.tar.gz" ]; then
            wget https://www.openssl.org/source/openssl-${OPENSSL_VER}.tar.gz
          fi
          tar xzf openssl-${OPENSSL_VER}.tar.gz
          cd openssl-${OPENSSL_VER}
          ./Configure --prefix=$HOME/openssl no-shared
          make -j$(nproc)
          make install_sw

      # ⑧ Cache PCRE
      - name: Cache PCRE
        uses: actions/cache@v4
        with:
          path: ~/pcre
          key: pcre-${{ env.PCRE_VER }}-${{ runner.os }}
          restore-keys: pcre-${{ env.PCRE_VER }}-${{ runner.os }}

      # ⑨ 编译 PCRE（静态）
      - name: Build PCRE2 static
        run: |
          mkdir -p ~/pcre
          cd ~/pcre
          # 这里用 GitHub Releases 的 URL
          if [ ! -f "pcre2-${PCRE_VER}.tar.gz" ]; then
            wget https://github.com/PCRE2Project/pcre2/releases/download/pcre2-${PCRE_VER}/pcre2-${PCRE_VER}.tar.gz
          fi
          tar xzf pcre2-${PCRE_VER}.tar.gz
          cd pcre2-${PCRE_VER}
          # 只编译静态库，开启 UTF‑8 / JIT（如果你需要）
          ./configure --prefix=$HOME/pcre \
                     --disable-shared \
                     --enable-static \
                     --enable-utf8 \
                     --enable-jit
          make -j$(nproc)
          make install
          
      # ⑩ Cache zlib
      - name: Cache zlib
        uses: actions/cache@v4
        with:
          path: ~/zlib
          key: zlib-${{ env.ZLIB_VER }}-${{ runner.os }}
          restore-keys: zlib-${{ env.ZLIB_VER }}-${{ runner.os }}

      # ⑪ 编译 zlib（静态）
      - name: Build zlib static
        run: |
          mkdir -p ~/zlib
          cd ~/zlib
          if [ ! -f "zlib-${ZLIB_VER}.tar.gz" ]; then
            wget https://zlib.net/zlib-${ZLIB_VER}.tar.gz
          fi
          tar xzf zlib-${ZLIB_VER}.tar.gz
          cd zlib-${ZLIB_VER}
          ./configure --prefix=$HOME/zlib --static
          make -j$(nproc)
          make install

      # ⑫ Cache Nginx
      - name: Cache Nginx
        uses: actions/cache@v4
        with:
          path: ~/nginx
          key: nginx-${{ env.NGINX_VER }}-${{ runner.os }}
          restore-keys: nginx-${{ env.NGINX_VER }}-${{ runner.os }}

        # ⑬ 下载并编译 Nginx（静态，HTTP/3）
      - name: Build Nginx static with HTTP/3
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p ~/nginx
          cd ~/nginx
          if [ ! -f "nginx-${NGINX_VER}.tar.gz" ]; then
            wget https://nginx.org/download/nginx-${NGINX_VER}.tar.gz
          fi
          tar xzf nginx-${NGINX_VER}.tar.gz
          cd nginx-${NGINX_VER}
          ./configure \
            --prefix=/opt/nginx \
            --sbin-path=/opt/nginx/nginx \
            --modules-path=/opt/nginx/modules \
            --conf-path=/opt/nginx/nginx.conf \
            --error-log-path=/opt/nginx/log/error.log \
            --http-log-path=/opt/nginx/log/access.log \
            --pid-path=/opt/nginx/run/nginx.pid \
            --lock-path=/opt/nginx/run/nginx.lock \
            --with-cc-opt="-static -O2 -march=native -I$HOME/openssl/include -I$HOME/pcre/include -I$HOME/zlib/include" \
            --with-ld-opt="-static -Wl,-Bstatic -L$HOME/openssl/lib -L$HOME/pcre/lib -L$HOME/zlib/lib -ldl -lpthread -lssl -lcrypto -lz" \
            --with-http_v3_module \
            --with-http_ssl_module \
            --with-http_gzip_static_module
            # --with-pcre2 \
            # --with-pcre2-jit \
            # --with-openssl=$HOME/openssl
          make -j$(nproc)
          make install

      # ⑭ 准备一个最小 HTTP/3 配置（可自行替换）
      - name: Prepare HTTP/3 config
        run: |
          mkdir -p $HOME/nginx-config/conf.d
          cat > $HOME/nginx-config/conf.d/http3.conf <<'EOF'
          server {
              listen 443 ssl http2;
              listen 443 quic reuseport;
              ssl_certificate /etc/nginx/ssl/nginx.crt;
              ssl_certificate_key /etc/nginx/ssl/nginx.key;
              ssl_protocols TLSv1.3;
              ssl_prefer_server_ciphers off;
              ssl_ciphers 'TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256';
              root /var/www/html;
              index index.html index.htm;
          }
          EOF
         # ──────────────────────────────────────────────────────────────────────
      # ⑩ 打包
      - name: Package
        run: |
          tar -czf nginx-static.tar.gz -C /opt/nginx . -C $HOME/nginx-config .
       # ──────────────────────────────────────────────────────────────────────
      # ⑬ 重命名 tarball 以包含所有版本号
      - name: Rename artifact
        run: |
          mv nginx-static.tar.gz ${{ env.ARTIFACT_NAME }}

      # ──────────────────────────────────────────────────────────────────────
      # ⑭ 上传到 GitHub Release
      - name: Create Release and upload asset
        uses: softprops/action-gh-release@v1
        with:
          tag_name: nginx-${{ env.NGINX_VER }}
          name: Nginx ${{ env.NGINX_VER }} (static, HTTP/3)
          body: |
            **OpenSSL**: ${{ env.OPENSSL_VER }}  
            **PCRE**: ${{ env.PCRE_VER }}  
            **zlib**: ${{ env.ZLIB_VER }}  
            **Nginx**: ${{ env.NGINX_VER }}
          files: ${{ env.ARTIFACT_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ⑰ (可选) 验证编译结果
      - name: Verify build
        run: |
          /opt/nginx/nginx -V
          # 下面的 curl 需要 curl 7.80+，可在后续 job 中安装
          # curl -I --http3 https://example.com
